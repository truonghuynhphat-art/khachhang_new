spring.datasource.url=jdbc:postgresql://localhost:5432/bank
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=bank-api-super-secret-key-change-this-in-production-min-32-chars
app.jwt.expiration-ms=86400000

app.alert.amount-threshold=5000000
app.alert.rapid-count=3
app.alert.rapid-window-seconds=60
management.endpoints.web.exposure.include=health,metrics,info,caches
management.endpoint.health.show-details=
spring.threads.virtual.enabled=true

# Mac dinh INFO cho code cua minh, giam bot noise tu framework
logging.level.com.bank=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN